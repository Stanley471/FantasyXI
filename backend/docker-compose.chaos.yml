version: '3.8'

services:
  postgres-chaos:
    image: postgres:16-alpine
    container_name: fantasyxi-postgres-chaos
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: fantasyxi_chaos
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fantasyxi_chaos"]
      interval: 5s
      timeout: 3s
      retries: 10

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.9.0
    container_name: fantasyxi-toxiproxy
    ports:
      - "8474:8474" # Toxiproxy API
      - "5434:5434" # Proxied Postgres port with chaos toxic injection
    depends_on:
      postgres-chaos:
        condition: service_healthy
    command: ["-host=0.0.0.0", "-config=/config/toxiproxy.json"]
    volumes:
      - ./toxiproxy-config.json:/config/toxiproxy.json:ro
